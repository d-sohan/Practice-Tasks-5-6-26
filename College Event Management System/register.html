<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3>Register</h3>
                    </div>
                    <div class="card-body">
                        <form onsubmit="showMessage(event)">
                            <div class="mb-3">
                                <label>Name</label>
                                <input type="text" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label>Roll Number</label>
                                <input type="text" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label>Branch</label>
                                <input type="text" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label>Email</label>
                                <input type="email" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label>Mobile Number</label>
                                <input type="tel" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label>Select Event</label>
                                <select class="form-select">
                                    <option>Hackathon</option>
                                    <option>Technical Quiz</option>
                                    <option>Coding Contest</option>
                                    <option>Project Expo</option>
                                </select>
                            </div>

                            <button class="btn btn-success">Submit Registration</button>
                        </form>
                        <div id="success" class="alert alert-success mt-3 d-none">
                            Registration Successful!
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showMessage(e) {
            e.preventDefault();
            document.getElementById("success").classList.remove("d-none");
        }
    </script>

</body>

</html>

<!DOCTYPE html>
<html>
<head>
    <title>Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <div class="row">
            <div class="col-md-6">
                <h3>Contact Us</h3>
                <form>
                    <div class="mb-3">
                        <input type="text" class="form-control" placeholder="Name">
                    </div>
                    <div class="mb-3">
                        <input type="email" class="form-control" placeholder="Email">
                    </div>
                    <div class="mb-3">
                        <textarea class="form-control" rows="5" placeholder="Message"></textarea>
                    </div>
                    <button class="btn btn-primary">Send Message</button>
                </form>
            </div>
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body">
                        <h4>Coordinator Details</h4>
                        <p><strong>Name:</strong> Event Coordinator</p>
                        <p><strong>Phone:</strong> +91 9876543210</p>
                        <p><strong>Email:</strong> coordinator@college.edu</p>
                        <hr>
                        <h5>Follow Us</h5>
                        <a href="#" class="btn btn-primary m-1">Facebook</a>
                        <a href="#" class="btn btn-danger m-1">Instagram</a>
                        <a href="#" class="btn btn-info m-1">Twitter</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

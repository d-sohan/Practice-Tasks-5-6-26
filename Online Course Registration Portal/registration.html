<!DOCTYPE html>
<html>
<head>
    <title>Course Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container py-5">
        <h2 class="mb-4">Student Registration</h2>
        <form>
            <input type="text" class="form-control mb-3" placeholder="Student Name">
            <input type="email" class="form-control mb-3" placeholder="Email">
            <input type="tel" class="form-control mb-3" placeholder="Mobile Number">
            <select class="form-select mb-3">
                <option>Select Gender</option>
                <option>Male</option>
                <option>Female</option>
            </select>
            <select class="form-select mb-3">
                <option>Select Course</option>
                <option>Web Development</option>
                <option>Python Programming</option>
                <option>Data Science</option>
                <option>AI & ML</option>
            </select>
            <input type="text" class="form-control mb-3" placeholder="Qualification">
            <textarea class="form-control mb-3" rows="4" placeholder="Address"></textarea>
            <input type="file" class="form-control mb-3">
            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input">
                <label class="form-check-label">Accept Terms & Conditions</label>
            </div>
            <button type="button" class="btn btn-success">Submit</button>
        </form>
        <div class="alert alert-success mt-4">
            Registration Successful!
        </div>
    </div>
</body>
</html>

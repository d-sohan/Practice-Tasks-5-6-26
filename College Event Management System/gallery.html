<!DOCTYPE html>
<html>
<head>
    <title>Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .gallery img {
            height: 250px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <h2 class="text-center mb-5">Event Gallery</h2>
        <div class="row g-4 gallery">
            <div class="col-md-4">
                <div class="card">
                    <img src="https://source.unsplash.com/500x400/?college-event" class="card-img-top">
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <img src="https://source.unsplash.com/500x400/?coding" class="card-img-top">
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <img src="https://source.unsplash.com/500x400/?hackathon" class="card-img-top">
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <img src="https://source.unsplash.com/500x400/?students">
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <img src="https://source.unsplash.com/500x400/?technology">
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <img src="https://source.unsplash.com/500x400/?festival">
                </div>
            </div>
        </div>
    </div>

</body>

</html>
